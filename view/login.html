<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Glowtica</title>

    <link rel="stylesheet" href="estilos.css">

</head>

<body>

<header>

    <div class="logo">Glowtica</div>

    <button class="menu-toggle" id="menu-toggle">☰</button>

    <nav id="menu">

        <ul>

            <li><a href="inicio.html">Inicio</a></li>

            <li><a href="productos.html">Productos</a></li>

            <li><a href="encuesta.html">Encuesta</a></li>

            <li><a href="login.html">Iniciar sesión</a></li>

            <li><a href="registros.html">Registrarse</a></li>

        </ul>

    </nav>

</header>


<section class="formulario">

    <h2>Iniciar Sesión</h2>

    <form action="menu.html">

        <label>Correo electrónico</label>

        <input 
            type="email" 
            placeholder="Ingrese su correo" 
            required
        >

        <label>Contraseña</label>

        <input 
            type="password" 
            placeholder="Ingrese su contraseña" 
            required
        >

        <input 
            type="submit" 
            value="Ingresar"
        >

    </form>

    <p>¿No tienes una cuenta?</p>

    <a class="boton" href="registro.html">Crear Cuenta</a>

</section>

<button id="btnArriba" title="Volver arriba">↑</button>

<script src="../controller/app.js"></script>

</body>

</html>
